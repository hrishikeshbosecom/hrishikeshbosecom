name: SuperKart Sales Forecasting Pipeline

on:
  push:
    branches:
      - main            # Automatically triggers on push to the main branch
  workflow_dispatch:    # Lets you click "Run workflow" in the Actions tab

permissions:
  contents: write       # Required to push the trained model back to main

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Dependencies
        run: pip install -r superkart_project/requirements.txt
      - name: Register Dataset
        run: python superkart_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: superkart_project/data/SuperKart.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Dependencies
        run: pip install -r superkart_project/requirements.txt
      - name: Run Data Preparation
        run: python superkart_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: splits/

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Dependencies
        run: pip install -r superkart_project/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: splits/
      - name: Start MLflow Server
        run: |
          nohup mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri ./mlruns > mlflow.log 2>&1 &
          sleep 10   # Give the tracking server time to start
      - name: Model Building
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: python superkart_project/model_building/train.py
      - name: Upload MLflow Runs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add superkart_project/deployment/superkart_sales_model.joblib superkart_project/deployment/model_metrics.json
          git commit -m "Update trained model [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main
